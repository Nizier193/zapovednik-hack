services:
  streamlit-visualization:
    image: ${DOCKER_USERNAME}/${DOCKER_PREFIX}-streamlit-visualization:${TAG}
    ports:
      - "8501:8501"
    env_file:
      - .env
    networks:
      - app-network

  backend:
    image: ${DOCKER_USERNAME}/${DOCKER_PREFIX}-backend:${TAG}
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    networks:
      - app-network
    # Внешний порт не пробрасываем — redis нужен только внутри сети.

  postgres:
    image: postgres:13
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - app-network
    # На прод базу не пробрасываем наружу. Для дампа/восстановления используем `docker compose exec postgres ...`.

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: