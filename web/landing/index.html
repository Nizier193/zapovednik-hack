<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>главная</title>
  <link rel="stylesheet" href="/landing/landing.css?v=9">
  <link rel="stylesheet" href="/landing/map/map.css?v=9">
</head>
<body class="home">
  <canvas id="ascii-field" class="cursor-trail" aria-hidden="true"></canvas>
  <div class="field-ornament" aria-hidden="true">
    <img class="spruce" src="/assets/spruce-tip.png" alt="">
    <img class="contour" src="/assets/contour-lines.png" alt="">
    <img class="leaf-mint" src="/assets/leaf-mint.png" alt="">
    <img class="leaf-outline" src="/assets/leaf-outline.png" alt="">
    <img class="leaf-sage" src="/assets/leaf-sage.png" alt="">
    <img class="shadow" src="/assets/forest-shadow.png" alt="">
  </div>
  <header class="nav">
    <a class="brand" href="/landing">
      <img src="/assets/cu-mark.png?v=2" alt="ЦУ" width="88" height="64">
      <h1>главная</h1>
    </a>
    <nav aria-label="Страницы">
      <a class="archive-link" href="/landing/dashboard">Архив</a>
    </nav>
  </header>

  <main>
    <section class="reserve-map" id="reserve-map" aria-label="Карта заповедника">
      <div class="map-bar">
        <a class="archive-link" href="/landing/dashboard">Архив</a>
        <label class="date-field" for="map-date">
          <input id="map-date" type="date" aria-label="День архива">
        </label>
        <button type="button" id="map-prev">Предыдущий день</button>
        <button type="button" id="map-next">Следующий день</button>
        <button type="button" id="map-motion" aria-pressed="true">Пауза</button>
        <button type="button" id="map-frame">К станциям</button>
        <button type="button" id="map-nearest" hidden>Ближайший день с потоком</button>
      </div>
      <div class="map-stage" id="map-stage">
        <canvas id="map" aria-hidden="true"></canvas>
        <p class="north">север</p>
        <div class="legend" id="map-legend"></div>
        <div class="map-notes">
          <p>Станции стоят схематично: координат в архиве нет. Кр1, поляна и Кр2, поле - соседние участки.</p>
          <p>Поток схематично показан по архивным наблюдениям станций.</p>
        </div>
        <div class="markers" id="map-markers"></div>
        <div class="tip" id="map-tip" role="tooltip" hidden></div>
        <ul class="phone-list" id="map-phone" aria-label="Станции"></ul>
      </div>
    </section>

    <section class="team" id="team">
      <figure class="crew">
        <figcaption>лучший дрим-тим: Название_команды_не_забыть_изменить</figcaption>
        <div class="photo" id="crew-photo">
          <canvas class="src"></canvas>
          <img class="slot" src="/assets/crew.jpg" alt="Команда: четверо с плюшевыми тюленями">
          <canvas class="out"></canvas>
        </div>
      </figure>
    </section>
  </main>
  <script type="module" src="/landing/landing.js?v=9"></script>
  <script src="/landing/map/map.js?v=10"></script>
</body>
</html>
