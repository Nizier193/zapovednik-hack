<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>главная</title>
  <link rel="stylesheet" href="/landing/landing.css?v=13">
  <link rel="stylesheet" href="/landing/map/map.css?v=9">
</head>
<body class="home">
  <canvas id="ascii-field" class="cursor-trail" aria-hidden="true"></canvas>
  <div class="sheet">
  <div class="vectors" aria-hidden="true">
    <img class="back contour" src="/assets/contour-lines.png" alt="">
    <img class="back contour-low" src="/assets/contour-lines.png" alt="">
    <img class="front spruce" src="/assets/spruce-tip.png" alt="">
    <img class="front spruce-low" src="/assets/spruce-tip.png" alt="">
    <img class="front leaf-mint" src="/assets/leaf-mint.png" alt="">
    <img class="front leaf-mint-2" src="/assets/leaf-mint.png" alt="">
    <img class="front leaf-outline" src="/assets/leaf-outline.png" alt="">
    <img class="front leaf-outline-2" src="/assets/leaf-outline.png" alt="">
    <img class="front leaf-sage" src="/assets/leaf-sage.png" alt="">
    <img class="front leaf-sage-2" src="/assets/leaf-sage.png" alt="">
    <img class="back shadow" src="/assets/forest-shadow.png" alt="">
    <svg class="front ring-a" viewBox="0 0 160 160">
      <ellipse cx="80" cy="80" rx="62" ry="28" fill="none" stroke="#acc0b0" stroke-width="1.4"/>
      <ellipse cx="80" cy="86" rx="44" ry="18" fill="none" stroke="#bced91" stroke-width="1.4"/>
      <ellipse cx="80" cy="92" rx="24" ry="10" fill="none" stroke="#6d907c" stroke-width="1.4"/>
    </svg>
    <svg class="front ring-b" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="58" fill="none" stroke="#acc0b0" stroke-width="1.4"/>
      <circle cx="80" cy="80" r="36" fill="none" stroke="#bced91" stroke-width="1.4"/>
      <circle cx="80" cy="80" r="16" fill="none" stroke="#3e5549" stroke-width="1.4"/>
    </svg>
    <svg class="front fir" viewBox="0 0 120 160">
      <path d="M60 8 L96 58 H24 Z" fill="none" stroke="#bced91" stroke-width="1.6"/>
      <path d="M60 36 L108 96 H12 Z" fill="none" stroke="#acc0b0" stroke-width="1.6"/>
      <path d="M60 68 L114 132 H6 Z" fill="none" stroke="#bced91" stroke-width="1.6"/>
      <path d="M60 132 V154" fill="none" stroke="#bced91" stroke-width="1.6"/>
    </svg>
    <svg class="front fir-b" viewBox="0 0 120 160">
      <path d="M60 10 L92 52 H28 Z" fill="#1c3a2c" stroke="#bced91" stroke-width="1.4"/>
      <path d="M60 40 L104 92 H16 Z" fill="#14261e" stroke="#acc0b0" stroke-width="1.4"/>
      <path d="M60 74 L112 128 H8 Z" fill="#10140f" stroke="#bced91" stroke-width="1.4"/>
    </svg>
  </div>
  <header class="nav">
    <a class="brand" href="/landing">
      <img src="/assets/cu-mark.png?v=2" alt="ЦУ" width="88" height="64">
      <h1>главная</h1>
    </a>
    <nav aria-label="Страницы">
      <a class="archive-link" href="/landing/dashboard">Архив</a>
    </nav>
  </header>

  <main>
    <section class="reserve-map" id="reserve-map" aria-label="Карта заповедника">
      <div class="map-bar">
        <a class="archive-link" href="/landing/dashboard">Архив</a>
        <label class="date-field" for="map-date">
          <input id="map-date" type="date" aria-label="День архива">
        </label>
        <button type="button" id="map-prev">Предыдущий день</button>
        <button type="button" id="map-next">Следующий день</button>
        <button type="button" id="map-motion" aria-pressed="true">Пауза</button>
        <button type="button" id="map-frame">К станциям</button>
        <button type="button" id="map-nearest" hidden>Ближайший день с потоком</button>
      </div>
      <div class="map-stage" id="map-stage">
        <canvas id="map" aria-hidden="true"></canvas>
        <p class="north">север</p>
        <div class="legend" id="map-legend"></div>
        <div class="map-notes">
          <p>Станции стоят схематично: координат в архиве нет. Кр1, поляна и Кр2, поле - соседние участки.</p>
          <p>Поток схематично показан по архивным наблюдениям станций.</p>
        </div>
        <div class="markers" id="map-markers"></div>
        <div class="tip" id="map-tip" role="tooltip" hidden></div>
        <ul class="phone-list" id="map-phone" aria-label="Станции"></ul>
      </div>
    </section>

    <div class="vector-band" aria-hidden="true">
      <img src="/assets/spruce-tip.png" alt="">
      <svg viewBox="0 0 180 110">
        <ellipse cx="90" cy="48" rx="72" ry="26" fill="none" stroke="#acc0b0" stroke-width="1.4"/>
        <ellipse cx="90" cy="58" rx="50" ry="18" fill="none" stroke="#bced91" stroke-width="1.4"/>
        <ellipse cx="90" cy="66" rx="28" ry="10" fill="none" stroke="#6d907c" stroke-width="1.4"/>
      </svg>
      <img class="tilt" src="/assets/leaf-outline.png" alt="">
      <img src="/assets/leaf-sage.png" alt="">
      <svg viewBox="0 0 80 110">
        <path d="M40 6 L62 40 H18 Z" fill="none" stroke="#bced91" stroke-width="1.5"/>
        <path d="M40 28 L70 72 H10 Z" fill="none" stroke="#acc0b0" stroke-width="1.5"/>
        <path d="M40 72 V102" fill="none" stroke="#bced91" stroke-width="1.5"/>
      </svg>
      <img class="tilt-back" src="/assets/leaf-mint.png" alt="">
    </div>

    <section class="team" id="team">
      <figure class="crew">
        <figcaption>лучший дрим-тим: Название_команды_не_забыть_изменить</figcaption>
        <div class="photo" id="crew-photo">
          <canvas class="src"></canvas>
          <img class="slot" src="/assets/crew.jpg" alt="Команда: четверо с плюшевыми тюленями">
          <canvas class="out"></canvas>
        </div>
      </figure>
    </section>
  </main>
  </div>
  <script type="module" src="/landing/landing.js?v=11"></script>
  <script src="/landing/map/map.js?v=12"></script>
</body>
</html>
