<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Архив, урочище Красное</title>
  <link rel="stylesheet" href="/landing/dashboard/dashboard.css">
  <script defer src="/landing/dashboard/dashboard.js"></script>
  <script type="module" src="/landing/dashboard/trail.js"></script>
</head>
<body>
<canvas id="ascii-field" aria-hidden="true"></canvas>
<div class="shell">
  <aside class="side">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 4 2 6 0 9-3 1-6 3-6 7 4-1 7-1 9 1 1-4 4-6 7-7-2-1-3-3-3-6-3 1-5 0-7-4z"/></svg>
      <span>Архив</span>
    </div>
    <p class="side-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 4-4.5 7-4.5S17.5 16 19 19"/></svg> Станция</p>
    <div class="station-block" id="stations" role="radiogroup" aria-label="Станция"></div>
    <p class="side-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></svg> Показатель</p>
    <label class="field"><select id="metric"></select></label>
    <p class="side-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg> Разбор</p>
    <fieldset class="checks">
      <label><input type="checkbox" id="opt-ma" checked><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16l5-5 4 3 8-8"/></svg><span>Скользящее среднее</span><i class="dot" style="background:#7dcec6"></i></label>
      <label><input type="checkbox" id="opt-band" checked><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8c3 2 5 2 8-1s5-3 10 0M3 16c3-2 5-2 8 1s5 3 10 0"/></svg><span>Полоса 10-90%</span><i class="dot" style="background:#7eaae0"></i></label>
      <label><input type="checkbox" id="opt-anomaly" checked><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14l3-6 3 4 3-8 3 10 4-4"/></svg><span>Отклонения и кластеры</span><i class="dot" style="background:#e3c36a"></i></label>
      <label><input type="checkbox" id="opt-rose"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg><span>Роза ветров</span><i class="dot" style="background:#c9a0e0"></i></label>
      <label><input type="checkbox" id="opt-soil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 13h16M4 18h16"/></svg><span>Профиль почвы</span><i class="dot" style="background:#8fd18a"></i></label>
    </fieldset>
    <p class="side-note" id="side-note"></p>
    <a class="back" href="/landing">Полевой журнал</a>
  </aside>
  <div class="maincol">
    <section class="stats" id="stats" aria-label="Сводка периода"></section>
    <div class="charts" id="charts">
      <section class="panel" aria-labelledby="main-title">
        <div class="panel-head">
          <h2 id="main-title">Температура воздуха</h2>
          <p class="legend" id="main-legend"></p>
        </div>
        <div class="plot"><canvas id="chart"></canvas><div class="tip" id="chart-tip" hidden></div></div>
      </section>
      <div class="extra">
        <section class="panel" id="anomaly-panel" aria-labelledby="anomaly-title">
          <div class="panel-head">
            <h2 id="anomaly-title">Аномалии и кластеры</h2>
            <p class="legend" id="anomaly-legend"></p>
          </div>
          <p class="caption" id="anomaly-caption"></p>
          <div class="plot"><canvas id="anomaly"></canvas><div class="tip" id="anomaly-tip" hidden></div></div>
        </section>
        <section class="panel" id="rose-panel" hidden>
          <div class="panel-head"><h2>Роза ветров</h2><p class="legend" id="rose-note"></p></div>
          <div class="plot"><canvas id="rose"></canvas></div>
        </section>
        <section class="panel" id="soil-panel" hidden>
          <div class="panel-head"><h2>Почва</h2><p class="legend" id="soil-legend"></p></div>
          <div class="plot"><canvas id="soil"></canvas></div>
        </section>
      </div>
    </div>
    <section class="timeline" aria-label="Временная шкала">
      <div class="panel-head">
        <h2>Временная шкала</h2>
        <p class="legend" id="window-label"></p>
      </div>
      <div class="brush" id="brush">
        <canvas id="overview" aria-hidden="true"></canvas>
        <div id="selection" class="selection"></div>
        <input type="range" id="range-start" aria-label="Начало выбранного периода">
        <input type="range" id="range-end" aria-label="Конец выбранного периода">
      </div>
    </section>
  </div>
</div>
</body>
</html>
