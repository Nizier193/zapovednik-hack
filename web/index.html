<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Взорвать</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07080c; }
    body { display: grid; place-items: center; overflow: hidden; }
    button {
      width: min(92vw, 920px);
      height: min(64vh, 420px);
      border: 0;
      background: #e23b32;
      color: #fff;
      font: 700 clamp(48px, 10vw, 120px)/1 Impact, Haettenschweiler, "Arial Narrow", sans-serif;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    button:hover { background: #ff5346; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <button type="button" id="boom">ВЗОРВАТЬ</button>
  <canvas id="dust"></canvas>
  <script>
    const button = document.getElementById("boom");
    const canvas = document.getElementById("dust");
    const ctx = canvas.getContext("2d");
    button.addEventListener("click", () => {
      const box = button.getBoundingClientRect();
      const x = box.left + box.width / 2;
      const y = box.top + box.height / 2;
      button.remove();
      const bits = Array.from({ length: 90 }, () => ({
        x, y,
        vx: (Math.random() - 0.5) * 28,
        vy: (Math.random() - 0.7) * 24,
        r: 6 + Math.random() * 18,
        color: Math.random() > 0.35 ? "#e23b32" : "#f6d7a8"
      }));
      const paint = () => {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        bits.forEach(bit => {
          bit.x += bit.vx;
          bit.y += bit.vy;
          bit.vy += 0.35;
          ctx.fillStyle = bit.color;
          ctx.fillRect(bit.x, bit.y, bit.r, bit.r);
        });
        if (bits.some(bit => bit.y < innerHeight + 40)) requestAnimationFrame(paint);
      };
      paint();
    });
  </script>
</body>
</html>
